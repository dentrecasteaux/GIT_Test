; PlatformIO Project Configuration File
;
;   Build options: build_src, build_flags, build_unflags
;   Upload options: upload_port, upload_flags, upload_speed
;   Debug options: debug_tool, runner.setup, runner.target
;
; For detailed documentation, see:
;   https://docs.platformio.org/page/projectconf.html

; ============================================================
; DEFAULT BOARD - ESP32-S3 (No PSRAM)
; This is the N8 variant with 8MB flash, no external PSRAM
; ============================================================
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Flash settings - 8MB flash, no PSRAM
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ=160

; Serial monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Library dependencies
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

; ============================================================
; PSRAM SUPPORT (Uncomment to enable for boards WITH PSRAM)
; ============================================================
;[env:esp32-s3-psram]
;platform = espressif32
;board = esp32-s3-devkitc-1
;framework = arduino
;
;board_build.arduino.memory_type = qio_opi
;board_build.flash_mode = qio
;board_build.psram_type = opi
;board_upload.flash_size = 16MB
;board_upload.maximum_size = 16777216
;board_build.extra_flags = -DBOARD_HAS_PSRAM
;
;build_flags =
;    -D CORE_DEBUG_LEVEL=3
;
;monitor_speed = 115200
