; PlatformIO Project Configuration File
;
;   Build options: build_src, build_flags, build_unflags
;   Upload options: upload_port, upload_flags, upload_speed
;   Debug options: debug_tool, runner.setup, runner.target
;
; For detailed documentation, see:
;   https://docs.platformio.org/page/projectconf.html

; ============================================================
; DEFAULT BOARD - ESP32-S3 DevKitC-1
; For boards without PSRAM or with custom configuration
; ============================================================
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.partitions = default_8MB.csv

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ=160

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Library dependencies
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
