; PlatformIO Project Configuration File
;
;   Build options: build_src, build_flags, build_unflags
;   Upload options: upload_port, upload_flags, upload_speed
;   Debug options: debug_tool, runner.setup, runner.target
;
; For detailed documentation, see:
;   https://docs.platformio.org/page/projectconf.html

; ============================================================
; DEFAULT BOARD - ESP32-S3 N16R8 (16MB Flash, 8MB PSRAM)
; Custom board definition for OPI PSRAM
; ============================================================
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Override board settings for N16R8 variant
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; PSRAM configuration - OPI (Octal SPI) mode
board_build.extra_flags = 
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_MODE_OCTAL
    -DCONFIG_SPIRAM_TYPE_OPI
    -DARDUINO_ARCH_ESP32

build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM
    -DCONFIG_ESPTOOLPY_FLASHMODE_QIO
    -D CORE_DEBUG_LEVEL=3

; Serial monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Library dependencies
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
