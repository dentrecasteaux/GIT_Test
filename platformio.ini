; PlatformIO Project Configuration File
;
;   Build options: build_src, build_flags, build_unflags
;   Upload options: upload_port, upload_flags, upload_speed
;   Debug options: debug_tool, runner.setup, runner.target
;
; For detailed documentation, see:
;   https://docs.platformio.org/page/projectconf.html

; ============================================================
; DEFAULT BOARD - ESP32-S3
; Working configuration without PSRAM causing reset loops
; ============================================================
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Flash and PSRAM settings - NO PSRAM for this board
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv

; CPU frequency - lower to avoid issues
build_flags =
    -D CONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ=160

; Serial monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ============================================================
; ALTERNATIVE BOARDS - Uncomment as needed
; ============================================================

