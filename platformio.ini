; PlatformIO Project Configuration File
;
;   Build options: build_src, build_flags, build_unflags
;   Upload options: upload_port, upload_flags, upload_speed
;   Debug options: debug_tool, runner.setup, runner.target
;
; For detailed documentation, see:
;   https://docs.platformio.org/page/projectconf.html

; ============================================================
; DEFAULT BOARD - ESP32-S3 N16R8 Custom
; 16MB Flash, 8MB PSRAM with OPI mode
; ============================================================
[env:esp32-s3]
platform = espressif32
board = esp32-s3-n16r8
framework = arduino

; PSRAM configuration - OPI mode enabled via BOARD_HAS_PSRAM flag
build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM
    -D CORE_DEBUG_LEVEL=3

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Library dependencies
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
