; PlatformIO Project Configuration File
;
;   Build options: build_src, build_flags, build_unflags
;   Upload options: upload_port, upload_flags, upload_speed
;   Debug options: debug_tool, runner.setup, runner.target
;
; For detailed documentation, see:
;   https://docs.platformio.org/page/projectconf.html

; ============================================================
; DEFAULT BOARD - ESP32-S3 N16R8 (16MB Flash, 8MB PSRAM)
; ============================================================
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.extra_flags = -DBOARD_HAS_PSRAM

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; upload_port = auto-detect
; monitor_port = auto-detect

; ============================================================
; ALTERNATIVE BOARDS - Uncomment as needed
; ============================================================

; --- ESP32-S3 (8MB Flash) ---
; [env:esp32-s3-8mb]
; platform = espressif32
; board = esp32-s3-devkitc-1
; framework = arduino
; monitor_speed = 115200
; upload_speed = 921600

; --- ESP32-C3 ---
; [env:esp32-c3-devkitm-1]
; platform = espressif32
; board = esp32-c3-devkitm-1
; framework = arduino
; monitor_speed = 115200
; upload_speed = 115200

; --- ESP32 (original) ---
; [env:esp32dev]
; platform = espressif32
; board = esp32dev
; framework = arduino
; monitor_speed = 115200
; upload_speed = 921600

; --- Teensy 4.1 ---
; [env:teensy41]
; platform = teensy
; board = teensy41
; framework = arduino
; monitor_speed = 115200
; upload_method = teensy-cli
; upload_protocol = teensy-cli

; --- Teensy 4.0 ---
; [env:teensy40]
; platform = teensy
; board = teensy40
; framework = arduino
; monitor_speed = 115200
; upload_method = teensy-cli
; upload_protocol = teensy-cli

; --- nRF52840 DK ---
; [env:nrf52840dk]
; platform = nordicnrf52
; board = nrf52840dk
; framework = arduino
; monitor_speed = 115200
; upload_tool = nrfjprog
; upload_protocol = nrf-jlink

; --- Arduino Uno ---
; [env:uno]
; platform = atmelavr
; board = uno
; framework = arduino
; monitor_speed = 9600

; ============================================================
; COMMON BUILD FLAGS (applied to all envs)
; ============================================================
[common]
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS
    -D ENABLE_DEBUG
