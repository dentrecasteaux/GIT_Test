; ============================================================
; COMMON BUILD FLAGS (applied to all envs)
; ============================================================
[common]
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS
    -D ENABLE_DEBUG

[env:esp32-s3]
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
