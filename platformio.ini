; PlatformIO Project Configuration File
;
;   Build options: build_src, build_flags, build_unflags
;   Upload options: upload_port, upload_flags, upload_speed
;   Debug options: debug_tool, runner.setup, runner.target
;
; For detailed documentation, see:
;   https://docs.platformio.org/page/projectconf.html

; ============================================================
; DEFAULT BOARD - ESP32-S3 N16R8 (Custom Configuration)
; 16MB Flash, 8MB PSRAM with OPI mode
;
; Uses esp32-s3-devkitc-1 board but overrides for N16R8 module
; ============================================================
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 1. Configure Flash Size and Layout
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; 2. Configure Flash & PSRAM Speed/Interface
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

; 3. Enable PSRAM and USB CDC Serial
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; 4. Serial Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Library dependencies
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
